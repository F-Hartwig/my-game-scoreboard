name: scoreboard

services:
  scoreboard:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: scorebuddy-live:local
    container_name: game-scoreboard-db
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /data/scoreboard.db
      NODE_ENV: production
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
    ports:
      - "8085:3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
