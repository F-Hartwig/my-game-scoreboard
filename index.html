<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" id="themeColorMeta" content="#f4f7fc">
    <meta name="description" content="ScoreBuddy – der moderne Spielstandbegleiter für gemeinsame Spieleabende.">
    <title>ScoreBuddy</title>
    <link rel="stylesheet" href="/style.css">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231e1b4b'/%3E%3Crect x='10' y='10' width='80' height='80' rx='18' fill='none' stroke='%234f46e5' stroke-width='2.5'/%3E%3Ctext x='50' y='63' font-family='Arial Black, Impact, sans-serif' font-size='34' font-weight='900' fill='%23ffffff' text-anchor='middle' letter-spacing='-1.5'%3ESB%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.png">
</head>
<body>
    <div class="ambient-background" aria-hidden="true">
        <span class="ambient-orb ambient-orb-one"></span>
        <span class="ambient-orb ambient-orb-two"></span>
        <span class="ambient-orb ambient-orb-three"></span>
    </div>

    <header class="header">
        <div class="brand-lockup">
            <div class="brand-mark" aria-hidden="true">SB</div>
            <div class="brand-copy">
                <span class="brand-eyebrow">Game night companion</span>
                <h1 id="headerTitle">ScoreBuddy</h1>
            </div>
        </div>
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Farbschema wechseln" title="Farbschema wechseln">
            <span class="theme-indicator" aria-hidden="true"></span>
            <span id="themeToggleLabel">Dunkel</span>
        </button>
    </header>

    <main class="app-shell">
        <div class="toolbar" aria-label="Spielwerkzeuge">
            <button class="tool-chip in-game-only" id="startPlayerToolBtn" onclick="openStartPlayerSelectorModal()" style="display: none;">
                Startspieler
            </button>
            <button class="tool-chip in-game-only" id="dealerToolBtn" onclick="rotateDealerManually()" style="display: none;">
                <span id="dealerLabel">Geber: --</span>
            </button>

            <button class="tool-chip" id="timerToolBtn" onclick="toggleTimerMenu()">
                <span id="timerLabel" aria-live="polite">Timer</span>
            </button>

            <button class="tool-chip" id="diceToolBtn" onclick="openDiceModal()">
                Würfel
            </button>
        </div>

        <section id="gamePage" class="page active" aria-label="Spiel">
            <div id="gameContent" aria-live="polite"></div>
        </section>

        <section id="playersPage" class="page" aria-label="Spieler">
            <div class="card add-player-card">
                <div class="title">Spieler hinzufügen</div>
                <div class="inline-form">
                    <input id="playerInput" placeholder="Name eingeben…" autocomplete="off" maxlength="40">
                    <button class="add-player-btn" aria-label="Spieler hinzufügen" onclick="addPlayer()">+</button>
                </div>
            </div>
            <div id="playersList"></div>
        </section>

        <section id="statsPage" class="page" aria-label="Statistik">
            <div class="card stats-card">
                <div class="title">Bestenliste</div>
                <div id="ranking" class="ranking-list"></div>
            </div>
            <div class="card stats-card">
                <div class="title">Historie</div>
                <div id="history" class="history-list"></div>
            </div>
        </section>

        <section id="rulesPage" class="page" aria-label="Regeln">
            <div class="card rules-library-card">
                <div class="title">Spielesammlung &amp; Regeln</div>
                <p class="section-intro">
                    Alle hinterlegten Spielregeln und Limits auf einen Blick – auch ohne laufendes Match.
                </p>
                <div id="rulesGameList" class="rules-game-list"></div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
        <button class="nav-item active" onclick="navigate('gamePage', this)"><span>Spiel</span></button>
        <button class="nav-item" onclick="removeSyncBlockAndNavigate('playersPage', this)"><span>Spieler</span></button>
        <button class="nav-item" onclick="removeSyncBlockAndNavigate('statsPage', this)"><span>Statistik</span></button>
        <button class="nav-item" onclick="removeSyncBlockAndNavigate('rulesPage', this)"><span>Regeln</span></button>
    </nav>

    <div class="modal-overlay" id="appModal" onclick="closeModal()" role="presentation">
        <div class="modal" onclick="event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <h3 class="title" id="modalTitle">Bearbeiten</h3>
            <div id="modalBody"></div>
            <div style="display: flex; gap: 8px; margin-top: 16px;" id="modalActions"></div>
        </div>
    </div>

    <script type="module" src="/app.js"></script>
</body>
</html>
