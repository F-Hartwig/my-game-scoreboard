<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" id="themeColorMeta" content="#F7F7F5">
    <meta name="description" content="ScoreBuddy – der moderne Spielstandbegleiter für gemeinsame Partien.">
    <title>ScoreBuddy</title>
    <link rel="stylesheet" href="/style.css?v=mono-pulse-21">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23171717'/%3E%3Ctext x='50' y='64' font-family='Arial Black, Impact, sans-serif' font-size='34' font-weight='900' fill='%23FF5A1F' text-anchor='middle' letter-spacing='-1.5'%3ESB%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.png">
</head>
<body>
    <div id="authGate" class="auth-gate" aria-live="polite"></div>
    <a class="skip-link" href="#gamePage">Zum Inhalt</a>

    <header class="header">
        <div class="brand-lockup">
            <img class="brand-mark" src="/icon.png" width="50" height="50" alt="">
            <div class="brand-copy">
                <span class="brand-eyebrow">Game score companion</span>
                <h1 id="headerTitle">ScoreBuddy</h1>
            </div>
        </div>
        <div class="header-actions">
            <button class="account-btn" id="accountBtn" onclick="openAccountModal()" aria-label="Konto und Profilzuweisung öffnen" title="Konto und Profilzuweisung">
                <svg class="account-btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.6-4.1 3-6.2 7-6.2s6.4 2.1 7 6.2"></path></svg>
                <span id="accountLabel">Konto</span>
            </button>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Farbschema wechseln" title="Farbschema wechseln"><span class="theme-indicator" aria-hidden="true"><svg class="theme-icon-sun" viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg><svg class="theme-icon-moon" viewBox="0 0 24 24" focusable="false"><path d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z"></path></svg></span><span id="themeToggleLabel">Dunkel</span></button>
        </div>
    </header>

    <main class="app-shell">
        <div class="toolbar" aria-label="Spielwerkzeuge">
            <button class="tool-chip in-game-only" id="startPlayerToolBtn" onclick="openStartPlayerSelectorModal()" style="display: none;">
                Startspieler
            </button>
            <button class="tool-chip in-game-only" id="dealerToolBtn" onclick="rotateDealerManually()" style="display: none;">
                <span id="dealerLabel">Geber: --</span>
            </button>

            <button class="tool-chip" id="timerToolBtn" onclick="toggleTimerMenu()">
                <span id="timerLabel" aria-live="polite">Timer</span>
            </button>

            <button class="tool-chip" id="diceToolBtn" onclick="openDiceModal()">
                Würfel
            </button>
        </div>

        <section id="gamePage" tabindex="-1" class="page active" aria-label="Spiel">
            <div id="gameContent" aria-live="polite"></div>
        </section>

        <section id="playersPage" class="page" aria-label="Spieler">
            <div class="card add-player-card admin-only preview-write-control">
                <div class="title">Spieler hinzufügen</div>
                <div class="inline-form">
                    <input id="playerInput" aria-label="Name des neuen Spielers" placeholder="Name eingeben…" autocomplete="off" maxlength="40">
                    <button class="add-player-btn" aria-label="Spieler hinzufügen" onclick="addPlayer()">+</button>
                </div>
            </div>
            <div id="playerListToolbar" role="group" class="player-list-toolbar" aria-label="Spielerliste filtern"></div>
            <div id="playersList"></div>
        </section>

        <section id="statsPage" class="page" aria-label="Statistik">
            <div id="personalStatsOverview" class="personal-stats-overview" hidden></div>
            <div id="statsOverview" class="stats-overview" aria-live="polite"></div>
            <div class="card stats-card">
                <div class="title">Bestenliste</div>
                <div class="ranking-controls">
                    <div id="rankingGameToolbar" role="group" class="ranking-game-toolbar" aria-label="Bestenliste auswählen"></div>
                    <div id="rankingFilterToolbar" role="group" class="ranking-filter-toolbar" aria-label="Bestenliste filtern"></div>
                    <div id="rankingSortToolbar" role="group" class="ranking-sort-toolbar" aria-label="Bestenliste sortieren"></div>
                </div>
                <div id="ranking" class="ranking-list"></div>
            </div>
            <div class="card stats-card">
                <div class="title stats-section-title">
                    <span>Historie</span>
                    <span id="historyCountBadge" class="stats-count-badge"></span>
                </div>
                <div id="historyFilterToolbar" role="group" class="history-filter-toolbar" aria-label="Historie filtern"></div>
                <div id="history" class="history-list"></div>
            </div>
        </section>

        <section id="rulesPage" class="page" aria-label="Regeln">
            <div class="card rules-library-card">
                <div class="title">Spielesammlung &amp; Regeln</div>
                <p class="section-intro">
                    Alle hinterlegten Spielregeln und Limits auf einen Blick – auch ohne laufendes Match.
                </p>
                <div id="rulesGameList" class="rules-game-list"></div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Hauptnavigation">
        <button class="nav-item active" aria-current="page" onclick="removeSyncBlockAndNavigate('gamePage', this)"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-6h6v6"/></svg><span>Übersicht</span></button>
        <button class="nav-item" onclick="removeSyncBlockAndNavigate('playersPage', this)"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-15a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v2"/></svg><span>Spieler</span></button>
        <button class="nav-item nav-item--play preview-write-control" id="gameSwitcherTrigger" onclick="handleGameSwitcherTrigger(this)" aria-label="Spielen" aria-expanded="false" aria-controls="gameSwitcherPopover"><span class="nav-play-icon" aria-hidden="true"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span>Spielen</span></button>
        <button class="nav-item" onclick="removeSyncBlockAndNavigate('statsPage', this)"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V12m7 8V4m7 16V8"/></svg><span>Statistik</span></button>
        <button class="nav-item" onclick="removeSyncBlockAndNavigate('rulesPage', this)"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg><span>Regeln</span></button>
    </nav>

    <section class="game-switcher" id="gameSwitcherPopover" role="dialog" aria-modal="false" aria-label="Laufende Spiele wechseln" hidden>
        <div class="game-switcher__list" id="gameSwitcherList"></div>
        <div class="game-switcher__divider"></div>
        <button type="button" class="game-switcher__new" data-game-switcher-new>+ Neues Spiel anlegen</button>
    </section>

    <div class="modal-overlay" id="appModal" onclick="closeModal()" role="presentation">
        <div class="modal" onclick="event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h3 class="title" id="modalTitle">Bearbeiten</h3>
                <button class="modal-close" type="button" onclick="closeModal()" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
            </div>
            <div id="modalBody"></div>
            <div id="modalActions"></div>
        </div>
    </div>

    <div class="orientation-guard" role="alert" aria-live="assertive">
        <div class="orientation-guard-card">
            <strong>Bitte hochkant halten</strong>
            <span>Der Fokusmodus ist für die sichere Eingabe im Hochformat optimiert.</span>
        </div>
    </div>

    <script type="module" src="/app.js?v=mono-pulse-11"></script>
</body>
</html>
