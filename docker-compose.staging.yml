name: scorebuddy-staging

services:
  scoreboard-staging:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: scorebuddy-staging:local
    container_name: game-scoreboard-staging
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /data/scoreboard.db
      NODE_ENV: production
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
    ports:
      - "8086:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
